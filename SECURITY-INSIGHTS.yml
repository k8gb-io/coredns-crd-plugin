      primary: false
  license:
    url: https://github.com/k8gb-io/coredns-crd-plugin/blob/main/LICENSE
    expression: Apache-2.0
  documentation:
    contributing-guide: https://github.com/k8gb-io/coredns-crd-plugin/blob/main/CONTRIBUTING.md
    review-policy: https://github.com/k8gb-io/coredns-crd-plugin/blob/main/CONTRIBUTING.md#tests-and-review
    dependency-management-policy: https://github.com/k8gb-io/coredns-crd-plugin/blob/main/DEPENDENCY.md
    governance: https://github.com/k8gb-io/k8gb/blob/master/GOVERNANCE.md
    security-policy: https://github.com/k8gb-io/coredns-crd-plugin/blob/main/SECURITY.md
  release:
    automated-pipeline: true
    distribution-points:
      - uri: https://github.com/k8gb-io/coredns-crd-plugin/releases
        comment: Linux release archives, checksums, and release notes.
      - uri: https://github.com/k8gb-io/coredns-crd-plugin/pkgs/container/k8s_crd
        comment: Container images at ghcr.io/k8gb-io/k8s_crd.
    changelog: https://github.com/k8gb-io/coredns-crd-plugin/releases
  security:
    assessments:
      self:
        name: k8gb security self-assessment
        evidence: https://github.com/k8gb-io/k8gb/blob/master/self-assessment.md
        date: '2026-10-31'
        comment: |
          The k8gb self-assessment covers this plugin as the embedded CoreDNS
          that serves k8gb's DNS answers (its k8s_crd image is the CoreDNS the
          k8gb Helm chart deploys).
    tools:
      - name: CodeQL
        type: SAST
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          ci:
            name: CodeQL workflow runs
            location: https://github.com/k8gb-io/coredns-crd-plugin/actions/workflows/codeql.yml
            predicate-uri: https://docs.oasis-open.org/sarif/sarif/v2.1.0/sarif-v2.1.0.html
      - name: OSPS Baseline Scanner
        type: other
        rulesets:
          - osps-baseline
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          ci:
            name: OSPS Baseline workflow runs
            location: https://github.com/k8gb-io/coredns-crd-plugin/actions/workflows/publish-to-grc-store.yml
            predicate-uri: https://github.com/revanite-io/pvtr-publish-results
        comment: |
          Scans the repository against the OSPS Baseline at Maturity Level 2
          weekly and on demand, and publishes each signed result to
          https://grc.store/targets/k8gb-io/coredns-crd-plugin.
