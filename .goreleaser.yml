version: 2
before:
  hooks:
    - go mod download
builds:
  - env:
      - CGO_ENABLED=0
    id: coredns
    main: ./cmd/coredns.go
    binary: coredns
    goos:
      - linux
    goarch:
      - amd64
      - arm64
dockers_v2:
  - id: coredns
    ids: [coredns]
    images: [ghcr.io/k8gb-io/k8s_crd]
    tags: ["{{ .Tag }}"]
    dockerfile: Dockerfile.release
    platforms: [linux/amd64, linux/arm64]
    sbom: false
    flags: ["--provenance=false"]
  - id: coredns-amd64
    ids: [coredns]
    images: [ghcr.io/k8gb-io/k8s_crd]
    tags: ["{{ .Tag }}-amd64"]
    dockerfile: Dockerfile.release
    platforms: [linux/amd64]
    sbom: false
    flags: ["--provenance=false"]
  - id: coredns-arm64
    ids: [coredns]
    images: [ghcr.io/k8gb-io/k8s_crd]
    tags: ["{{ .Tag }}-arm64"]
    dockerfile: Dockerfile.release
    platforms: [linux/arm64]
    sbom: false
    flags: ["--provenance=false"]
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Version }}-next"
changelog:
  filters:
    exclude:
      - '^docs:'
      - '^test:'
