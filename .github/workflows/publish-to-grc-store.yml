name: Publish OSPS Baseline results to grc.store

# Scans the repository against the OSPS Baseline at Maturity Level 2 and
# publishes the signed result to https://grc.store/targets/k8gb-io/coredns-crd-plugin.
# Same setup as k8gb's publish-to-grc-store.yml; this repository is the second
# codebase listed in k8gb's Security Insights.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run the scan but publish nothing (bundles land in the pvtr-bundles artifact)"
        type: boolean
        default: false
  schedule:
    - cron: "27 6 * * 1" # Weekly, Mondays 06:27 UTC
  # No push or pull_request triggers: the hub stores one log per target and
  # catalog every ten minutes and rejects the rest with rate_limited, which
  # fails the run. After merging a fix, publish with `gh workflow run`.

permissions: {}

jobs:
  version:
    runs-on: ubuntu-26.04
    permissions:
      contents: read # Read the latest release tag
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443

      - name: Latest release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo v0.0.0)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  results:
    needs: version
    permissions:
      contents: read # The scanner reads this repository through the job token
      id-token: write # Trusted publishing to the hub and the Sigstore signing identity
      # The called workflow's report job declares it, and GitHub checks every
      # called job at startup, even one that upload-sarif: false skips.
      security-events: write
    # By tag, not SHA, on purpose: the hub compares the signing certificate's
    # workflow ref to this exact tag and rejects a SHA-pinned call. Renovate
    # ignores this dependency for the same reason (see renovate.json5).
    uses: revanite-io/pvtr-publish-results/.github/workflows/publish.yml@v1 # zizmor: ignore[unpinned-uses] the hub requires the tag
    with:
      target: k8gb-io/coredns-crd-plugin@${{ needs.version.outputs.version }}
      license: CC0-1.0 # SPDX expression the result is published under
      dry-run: ${{ inputs.dry-run == true }}
    secrets:
      # Inline because the plugin reads its token only from these config vars.
      # The job token is read-only and scoped to this repository; settings it
      # cannot read (org MFA, some admin settings) report "Needs Review".
      config: |
        targets:
          coredns-crd-plugin:
            plugin: openssf/github-repo
            policy:
              catalogs:
                - osps-baseline
              applicability:
                - maturity-2 # Evaluated at the same level as k8gb, a CNCF Incubating project
            vars:
              owner: k8gb-io
              repo: coredns-crd-plugin
              token: ${{ secrets.GITHUB_TOKEN }}
